services:
  aetherii:
    build: .
    ports:
      - "4173:4173"
    volumes:
      - aetherii-data:/data
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    restart: unless-stopped
volumes:
  aetherii-data:
